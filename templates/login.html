<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { margin-top: 4rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card mx-auto" style="max-width: 360px;">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Welcome Back</h3>
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-success w-100" type="submit">Log In</button>
        </form>
        <p class="text-center mt-3">
          <a href="{{ url_for('register_form') }}">New user? Register here</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
